name: Python package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint + typecheck
        run: make uv.check
      - name: Test (core)
        run: make uv.test
      - name: Test (extension)
        run: |
          sudo apt-get update
          sudo apt-get install -y gjs
          make ext-test
