# Secret scanning allowlist.
#
# src/aium/providers/google.py contains the PUBLIC OAuth client id/secret of
# Google's open-source Gemini CLI (https://github.com/google-gemini/gemini-cli),
# needed at runtime to refresh the user's Antigravity OAuth token. They are not
# user credentials, so exclude the file from secret-scanning alerts/push checks.
paths-ignore:
  - 'src/aium/providers/google.py'
